# Proyecto de Xcode para las dos apps.
#
# Empezó por una sola razón —**firmar contra un iPhone de verdad**— y ahora
# compila también el Mac, por otra: los **widgets**. Una extensión no es un
# binario más dentro del paquete, es otro paquete con su identificador, sus
# permisos y su punto de extensión, embebido en `PlugIns/` y firmado aparte; y
# un grupo de aplicaciones necesita que la firma vaya autorizada por un perfil.
# Las dos cosas las hace Xcode y no las hace `swift build`.
#
# Se declara aquí y no se guarda el `.xcodeproj`: un pbxproj es un archivo
# generado de miles de líneas que se llena de conflictos y que nadie lee. Esto
# son veinte líneas que se entienden.
name: Pauta
# La versión, en un solo sitio.
#
# Estaba escrita cuatro veces —app y widget, por plataforma— y las cuatro tienen
# que decir lo mismo siempre: un widget que dice 0.1.0 dentro de una app que dice
# 0.2.0 es un paquete que el sistema puede rechazar y, peor, una discrepancia que
# nadie mira hasta que falla. Aquí se hereda.
settings:
  base:
    MARKETING_VERSION: "0.3.1"
    CURRENT_PROJECT_VERSION: "5"

options:
  bundleIdPrefix: dev.jadrdev
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"
  createIntermediateGroups: true

targets:
  # El núcleo como objetivo del propio proyecto y no como dependencia del
  # paquete: dependiendo del paquete, Xcode intenta compilar **todos** sus
  # objetivos para iOS —incluido el ejecutable de macOS con su AppKit, su Carbon
  # y su ServiceManagement— y no hay forma de decirle que ese es solo del Mac.
  # Son los mismos archivos; lo que cambia es quién los compila.
  PautaCore:
    type: library.static
    platform: iOS
    sources:
      - Sources/PautaCore

  Pauta:
    type: application
    platform: iOS
    sources:
      - Sources/PautaIOS
      - Resources/ios/Assets.xcassets
    dependencies:
      - target: PautaCore
      - target: PautaWidget
      # Dentro del paquete del teléfono, en `Watch/`. No es decoración: el
      # sistema empareja las dos apps por ahí, y con la del reloj instalada por
      # su cuenta el teléfono contesta «counterpart app not installed» y el
      # vistazo no sale. Probado, y el error lo dijo tal cual.
      - target: PautaWatch
        embed: true
        copy:
          destination: wrapper
          subpath: Watch
      - sdk: WidgetKit.framework
      # Para el atajo de Siri: apuntar en la bandeja sin abrir la app.
      - sdk: AppIntents.framework
    info:
      path: build/ios/Generated-Info.plist
      properties:
        CFBundleName: Pauta
        CFBundleDisplayName: Pauta
        # Sin esto el plist generado se queda en «1.0» y la app miente sobre
        # qué versión es.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es]
        UILaunchScreen: {}
        NSRemindersFullAccessUsageDescription: >-
          Pauta lee su propia lista de Recordatorios para traer a la bandeja lo que apuntes con Siri o desde otro dispositivo.
        NSRemindersUsageDescription: >-
          Pauta lee su propia lista de Recordatorios para traer a la bandeja lo que apuntes con Siri o desde otro dispositivo.
        # Sin estas cadenas, pedir acceso al calendario aborta el proceso.
        NSCalendarsFullAccessUsageDescription: >-
          Pauta enseña los eventos de hoy junto a tus tareas, para que Hoy sea el día completo. Solo los lee: nunca escribe en tus calendarios.
        NSCalendarsUsageDescription: >-
          Pauta enseña los eventos de hoy junto a tus tareas, para que Hoy sea el día completo. Solo los lee: nunca escribe en tus calendarios.
        CFBundleURLTypes:
          - CFBundleURLName: dev.jadrdev.pauta
            CFBundleTypeRole: Editor
            CFBundleURLSchemes: [pauta]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jadrdev.pauta
        CODE_SIGN_ENTITLEMENTS: Resources/ios/Pauta.entitlements
        # Equipo personal, con membresía de pago: el perfil que emite Apple
        # dura un año y admite grupos de aplicaciones —lo que necesita el
        # widget para ver los datos de la app—. El de la empresa está en la
        # cuenta, y meter una app personal ahí es una decisión que no toca
        # tomar a un guion.
        DEVELOPMENT_TEAM: 26W4G92PSS
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        # Solo iPhone: la interfaz está pensada para una mano y un pulgar. En
        # un iPad cabría la del Mac, y esa es otra interfaz, no esta estirada.
        TARGETED_DEVICE_FAMILY: "1"

  PautaWidget:
    type: app-extension
    platform: iOS
    sources:
      - Sources/PautaWidget
      # La paleta y las versalitas del teléfono, compartidas y no copiadas: un
      # widget que no se parece a su app parece de otra app.
      - path: Sources/PautaIOS/Tema.swift
    dependencies:
      - target: PautaCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      # Para el botón de tachar: en un widget, un botón es un `AppIntent`.
      - sdk: AppIntents.framework
    info:
      path: build/ios/Widget-Info.plist
      properties:
        CFBundleDisplayName: Pauta
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jadrdev.pauta.widget
        CODE_SIGN_ENTITLEMENTS: Resources/ios/PautaWidget.entitlements
        DEVELOPMENT_TEAM: 26W4G92PSS
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"

  # ── El Mac ────────────────────────────────────────────────────────────────
  #
  # Mismos archivos que compila `swift build`, otro que los compila. El núcleo
  # va de nuevo como objetivo propio y por lo mismo que en iOS: el paquete trae
  # el ejecutable del Mac y el proyecto no sabría cuál es de quién.

  PautaCoreMac:
    type: library.static
    platform: macOS
    sources:
      - Sources/PautaCore
    settings:
      base:
        # El objetivo se llama distinto para no chocar con el de iOS, pero el
        # **módulo** tiene que llamarse igual: `import PautaCore` es el mismo en
        # las cuatro fuentes que lo usan.
        PRODUCT_NAME: PautaCore
        PRODUCT_MODULE_NAME: PautaCore

  PautaMac:
    type: application
    platform: macOS
    productName: Pauta
    sources:
      - Sources/Pauta
      - path: Resources/icon-mono.icns
        buildPhase: resources
      - path: Resources/icon-claro.icns
        buildPhase: resources
      - path: Resources/monogram.png
        buildPhase: resources
      - path: Resources/monogram-ink.png
        buildPhase: resources
      # El idioma no es decoración: AppKit localiza sus propios menús según los
      # idiomas que declara el bundle, y sin ninguno los deja en inglés dentro
      # de una app escrita entera en español.
      - path: Resources/es.lproj
        buildPhase: resources
    dependencies:
      - target: PautaCoreMac
      - target: PautaWidgetMac
      - sdk: WidgetKit.framework
    info:
      path: build/mac/Generated-Info.plist
      properties:
        CFBundleName: Pauta
        CFBundleDisplayName: Pauta
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconFile: $(ICONO)
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es]
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        # El esquema propio: es lo que hace que un clic en el widget abra la app
        # donde toca y no en la última pantalla que quedara.
        CFBundleURLTypes:
          - CFBundleURLName: dev.jadrdev.pauta
            CFBundleTypeRole: Editor
            CFBundleURLSchemes: [pauta]
        NSHumanReadableCopyright: © 2026 Joshua A. Díaz Robayna · Todos los derechos reservados
        # Sin estas cadenas, pedir acceso aborta el proceso.
        NSRemindersFullAccessUsageDescription: >-
          Pauta lee su propia lista de Recordatorios para traer a la bandeja lo que apuntes desde el iPhone o con Siri.
        NSRemindersUsageDescription: >-
          Pauta lee su propia lista de Recordatorios para traer a la bandeja lo que apuntes desde el iPhone o con Siri.
        NSCalendarsFullAccessUsageDescription: >-
          Pauta enseña los eventos de hoy junto a tus tareas, para que Hoy sea el día completo. Solo los lee: nunca escribe en tus calendarios.
        NSCalendarsUsageDescription: >-
          Pauta enseña los eventos de hoy junto a tus tareas, para que Hoy sea el día completo. Solo los lee: nunca escribe en tus calendarios.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jadrdev.pauta
        PRODUCT_NAME: Pauta
        # Que el perfil hace falta, dicho a Xcode.
        #
        # Con firma automática, Xcode decide si embebe perfil mirando este
        # ajuste, y en macOS le sale NO. Sin perfil embebido, un widget en
        # sandbox con un grupo de aplicaciones **muere al arrancar** en
        # `libsecinit`, antes de dibujar nada: tres caídas y un widget en blanco.
        # Apple sí emite estos perfiles para este equipo —traen el grupo con
        # comodín `26W4G92PSS.*`—; lo que faltaba era pedirlos.
        PROVISIONING_PROFILE_REQUIRED: YES
        # Variante de icono: icon-mono (fondo oscuro) o icon-claro.
        ICONO: icon-mono
        CODE_SIGN_ENTITLEMENTS: Resources/mac/Pauta.entitlements
        # Tu equipo y no el de la empresa. `build.sh` firmaba con «la primera
        # identidad Apple Development del llavero», que resultó ser la del
        # trabajo; en macOS el grupo lleva el equipo delante, así que la
        # elección deja de ser invisible.
        DEVELOPMENT_TEAM: 26W4G92PSS
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        # Sin sandbox: la app lee tus datos en iCloud Drive por ruta.
        ENABLE_APP_SANDBOX: NO

  PautaWidgetMac:
    type: app-extension
    platform: macOS
    sources:
      - Sources/PautaWidgetMac
      # El tema del Mac, compartido y no copiado.
      - path: Sources/Pauta/Views/Theme.swift
    dependencies:
      - target: PautaCoreMac
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: build/mac/Widget-Info.plist
      properties:
        CFBundleDisplayName: Pauta
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jadrdev.pauta.widget
        PRODUCT_NAME: PautaWidget
        PROVISIONING_PROFILE_REQUIRED: YES
        CODE_SIGN_ENTITLEMENTS: Resources/mac/PautaWidget.entitlements
        # El sandbox, **como ajuste de compilación** y no solo dentro del
        # archivo de entitlements. Parece redundante y no lo es: Xcode decide si
        # hace falta perfil de aprovisionamiento mirando este ajuste, no el
        # plist. Con esto en NO firmaba sin perfil, y al arrancar el widget se
        # declaraba en sandbox con un grupo que nada autorizaba: `libsecinit` lo
        # mataba antes de dibujar un píxel. Tres caídas y un widget en blanco.
        ENABLE_APP_SANDBOX: YES
        DEVELOPMENT_TEAM: 26W4G92PSS
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"

  # ── El reloj ──────────────────────────────────────────────────────────────
  #
  # De solo lectura: recibe del teléfono el mismo `Vistazo` que dibuja el widget
  # y lo enseña. No tiene almacén, así que no hay nada que perder ni reconciliar
  # aquí — y las dos cosas que una muñeca hace mejor que un teléfono, avisar y
  # dictarle a Siri, ya funcionaban sin app.

  PautaCoreWatch:
    type: library.static
    platform: watchOS
    sources:
      - path: Sources/PautaCore
        # Lo que en un reloj no existe, fuera — y no con `#if` repartidos por el
        # núcleo, que sería llenar de excepciones un código que hoy se lee
        # seguido. watchOS **prohíbe** escribir recordatorios y no tiene la
        # pantalla de permisos ni los eventos que enseña Hoy, y el reloj es de
        # solo lectura: no toca ninguna de las tres cosas.
        #
        # El precio, dicho: si algún día algo del reloj necesitara una de estas,
        # el compilador dirá que no está. Eso es lo que se quiere — un error, no
        # una divergencia silenciosa.
        excludes:
          - RemindersInbox.swift
          - PuestaAPunto.swift
          - Agenda.swift
    settings:
      base:
        PRODUCT_NAME: PautaCore
        PRODUCT_MODULE_NAME: PautaCore

  PautaWatch:
    type: application
    platform: watchOS
    sources:
      - Sources/PautaWatch
      # El icono, con su propio arte: la máscara de watchOS es un círculo y el
      # monograma va más pequeño que en el iPhone. Se genera con
      # `python3 tools/make-icon.py reloj`.
      - Resources/watch/Assets.xcassets
    dependencies:
      - target: PautaCoreWatch
      - target: PautaWatchWidget
      - sdk: WatchConnectivity.framework
      # Para avisar a la complicación de que hay vistazo nuevo.
      - sdk: WidgetKit.framework
    info:
      path: build/watch/Generated-Info.plist
      properties:
        CFBundleName: Pauta
        CFBundleDisplayName: Pauta
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es]
        WKApplication: true
        WKCompanionAppBundleIdentifier: dev.jadrdev.pauta
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jadrdev.pauta.watchkitapp
        PRODUCT_NAME: Pauta
        CODE_SIGN_ENTITLEMENTS: Resources/watch/PautaWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 26W4G92PSS
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"

  PautaWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - Sources/PautaWatchWidget
    dependencies:
      - target: PautaCoreWatch
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: build/watch/Widget-Info.plist
      properties:
        CFBundleDisplayName: Pauta
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        # Colgando del identificador de la app del reloj, que es lo que exige
        # watchOS: una extensión suya y no una app aparte.
        PRODUCT_BUNDLE_IDENTIFIER: dev.jadrdev.pauta.watchkitapp.complicacion
        PRODUCT_NAME: PautaWatchWidget
        CODE_SIGN_ENTITLEMENTS: Resources/watch/PautaWatchWidget.entitlements
        DEVELOPMENT_TEAM: 26W4G92PSS
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
